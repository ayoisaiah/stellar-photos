name: Test & Publish

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Biome check
        run: npm run check

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Vitest test suite
        run: npm test

      - name: Verify production build
        run: npm run build
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY || 'test-ci-key' }}

  publish:
    name: Build & Submit to Webstores
    needs: test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and package extensions
        run: |
          npx wxt zip -b chrome --mv3
          npx wxt zip -b firefox --mv3 --sources
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}

      - name: Submit to Chrome Web Store
        if: ${{ env.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL != '' }}
        run: |
          npx wxt submit \
            --chrome-api-version "v2" \
            --chrome-extension-id "${{ secrets.CHROME_EXTENSION_ID || 'dgjeipdebjigeaanhogpdjdjigogpjmo' }}" \
            --chrome-publisher-id "${{ secrets.CHROME_PUBLISHER_ID }}" \
            --chrome-service-account-client-email "${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}" \
            --chrome-service-account-private-key "${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}" \
            --chrome-zip dist/*-chrome.zip
        env:
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}

      - name: Submit to Firefox Add-ons
        if: ${{ env.FIREFOX_JWT_ISSUER != '' }}
        run: |
          npx wxt submit \
            --firefox-extension-id "${{ secrets.FIREFOX_EXTENSION_ID || 'stellar@stellarapp.photos' }}" \
            --firefox-jwt-issuer "${{ secrets.FIREFOX_JWT_ISSUER }}" \
            --firefox-jwt-secret "${{ secrets.FIREFOX_JWT_SECRET }}" \
            --firefox-zip dist/*-firefox.zip \
            --firefox-sources-zip dist/*-sources.zip
        env:
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}

      - name: Submit to Microsoft Edge Add-ons
        if: ${{ env.EDGE_API_KEY != '' }}
        run: |
          npx wxt submit \
            --edge-product-id "${{ secrets.EDGE_PRODUCT_ID || 'oifbedjcmofkjgmjakgbppkocdfpjpjg' }}" \
            --edge-client-id "${{ secrets.EDGE_CLIENT_ID }}" \
            --edge-api-key "${{ secrets.EDGE_API_KEY }}" \
            --edge-zip dist/*-chrome.zip
        env:
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
